name: Publish cookbook to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - run: npm test
      - run: npm run test:auth
      - run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_COOKBOOK_DEMO: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: cookbook-demo
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cookbook-demo
          path: demo-build
      - name: Publish the demo branch and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish
          cd publish
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!gh auth git-credential' fetch origin gh-pages
          git checkout -B gh-pages FETCH_HEAD
          git rm -r --ignore-unmatch .
          cp -a ../demo-build/. .
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "Publish demo from ${GITHUB_SHA}"
          git -c credential.helper='!gh auth git-credential' push origin HEAD:gh-pages
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
